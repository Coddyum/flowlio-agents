# Full development stack. One command, nothing to install locally:
#   docker compose up -d
#
# Two services: Postgres, then the API. The API carries its own migrations — they are embedded in
# the binary (see embed.go) and applied at startup in local mode, so there is no third container to
# sequence and, more importantly, the image is usable WITHOUT a checkout of this repository.
#
# In production the schema stays a human, explicit operation (`make up-prod`). The API detects that
# case and refuses to serve on a schema it does not match, rather than migrating on its own: a
# redeploy must never touch the schema without someone having decided so.
#
# Port 5433 for Postgres, so it does not collide with a local install on 5432.
#
# Same major version as production (Neon, Postgres 18): a major-version gap between dev and prod is
# a class of bugs you only see after deploying.
services:
  postgres:
    image: postgres:18-alpine
    container_name: flowlio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: flowlio
      POSTGRES_PASSWORD: flowlio
      POSTGRES_DB: flowlio
    # Bound to the loopback, not to every interface. Docker publishes on 0.0.0.0 by default, which
    # on a café wifi puts this database — password written in this very file — in front of anyone
    # who scans the subnet. Nothing needs it from off-box: the API reaches Postgres over the compose
    # network, and the CLI runs on this machine.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      # Postgres 18 expects the mount on /var/lib/postgresql (not .../data): the data goes into a
      # subdirectory, which keeps `pg_upgrade --link` possible later on.
      - flowlio-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowlio -d flowlio"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flowlio-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # The service talks to Postgres over the compose network, so on 5432 and by service name —
      # not through the 5433 published on the host, which only exists seen from outside.
      DATABASE_URL: postgres://flowlio:flowlio@postgres:5432/flowlio?sslmode=disable
      ADDR: ":42058"
      ENV: dev
    # Loopback too, for the same reason. The browser bridge still works: the page served by
    # flowlio.me runs in the user's OWN browser, so the call leaves from this machine. Serving the
    # instance to another machine on the network is a deliberate choice, and it belongs in the
    # user's own compose.override.yml — see the README.
    ports:
      - "127.0.0.1:42058:42058"
    volumes:
      # The credentials the API writes at first boot, kept out of the container's writable layer so
      # they survive `docker compose up --build`. `flowlio init` copies them onto the host from
      # here, which is why nobody has to grep a token out of the logs any more.
      #
      # A NAMED volume, not a bind mount of ~/.config: Docker initialises a named volume's
      # ownership from the image, where that directory already belongs to the container's user. A
      # bind mount would keep the host's ownership instead, and the container — running as uid
      # 10001 — could not write into it on Linux. Docker Desktop hides that on macOS by virtualising
      # ownership, which is exactly how the bug would have shipped.
      - flowlio-config:/home/flowlio/.config
    restart: unless-stopped

volumes:
  flowlio-pgdata:
  flowlio-config:
