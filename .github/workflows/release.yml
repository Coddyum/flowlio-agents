# Release — triggered by a version tag, never on push.
#
# The workflow takes NO shortcut on the guards: it replays build, vet and the tests before producing
# anything. Publishing binaries from a tree that does not pass CI is distributing a known defect.
#
# The release is created as a DRAFT (see .goreleaser.yaml): a tag pushed by mistake publishes
# nothing to anybody before a human has read it.
#
# Third-party actions are pinned to a commit SHA — see the note at the top of ci.yml.
name: Release

on:
  push:
    tags:
      # Version tags only. A working tag triggers nothing.
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # Create the release and upload the archives.
      contents: write
      # Provenance attestation: it ties the binaries to this repository and this tag, which a
      # private key sitting in the repository's secrets would not prove.
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # goreleaser reads the history to compose the release log: a shallow clone would make it
          # empty without an error.
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          # Version read from go.mod, never duplicated here.
          go-version-file: go.mod
          cache: true

      # The guards first. The integration tests do not run here: they need a Postgres, and CI has
      # already passed them on the commit this tag points at.
      - name: Guards
        run: |
          go build ./...
          go vet ./...
          go test ./...
          ./scripts/check-cross-feature-imports.sh
          ./scripts/check-file-size.sh
          ./scripts/check-sommaire.sh

      - name: The tag must point at a commit of main
        run: |
          # No --depth here: checkout above sets fetch-depth: 0, so the history is already complete.
          # `--depth=0` is not "unlimited depth" but a value git refuses (`fatal: depth 0 is not a
          # positive number`), and it failed this workflow's very first real run, on v0.1.0.
          git fetch origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "The tag does not descend from main: release refused." >&2
            exit 1
          fi

      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        id: goreleaser
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GitHub REFUSES to persist an attestation for a private repository owned by a personal
      # account ("Feature not available for user-owned private repositories"). That is not a
      # misconfiguration: it is a platform limit, observed on this workflow's first real run.
      #
      # The condition is on VISIBILITY, not on `continue-on-error`. An error-tolerant step would
      # produce releases without an attestation without anything saying so — and a provenance
      # guarantee that is silently absent is more dangerous than one that is absent. Here the step
      # shows up explicitly as "skipped" while the repository is private, and turns itself back on
      # the day it goes public, without anybody having to remember.
      #
      # It did: v0.4.0 is the first release to carry one.
      - name: Provenance attestation
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/*.tar.gz
