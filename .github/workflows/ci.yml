# CI — the repository's guards, run for everybody and not only in the local hook.
#
# One job: a red guard is a red CI. No secret is needed, so this workflow runs as it stands on a
# fork.
#
# THIRD-PARTY ACTIONS ARE PINNED TO A COMMIT SHA, with the tag kept in a trailing comment. A tag is
# mutable: whoever owns that repository can move `v9` onto new code, and this pipeline would run it
# without a diff anywhere. The comment is what makes the pin readable; the SHA is what makes it a
# pin.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only: this workflow publishes nothing and comments nowhere.
permissions:
  contents: read

env:
  # golang-migrate CLI version, aligned with the stack documented in CLAUDE.md.
  MIGRATE_VERSION: v4.19.1
  # golangci-lint version, pinned so that CI and a developer's machine see the same linters enabled
  # by default.
  GOLANGCI_LINT_VERSION: v2.11.4

jobs:
  build-and-check:
    # THIS NAME IS LOAD-BEARING. It is the required status check of the `main` ruleset, matched as a
    # literal string. Renaming it makes the required check stop being reported, and a pull request
    # then waits forever on a status nothing will ever post. Change it and the ruleset together —
    # see docs/GITHUB-SETTINGS.md.
    name: build, guards and tests
    runs-on: ubuntu-latest

    services:
      # Same major version as in development (docker-compose.yml) and in production (Neon):
      # Postgres 18.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: flowlio
          POSTGRES_PASSWORD: flowlio
          POSTGRES_DB: flowlio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowlio -d flowlio"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Read by the Makefile (DB_URL_DEV) for `make up-dev` and `make test-integration`.
      # No .env in CI: the variable comes from the environment and nowhere else.
      DATABASE_URL: postgres://flowlio:flowlio@localhost:5432/flowlio?sslmode=disable

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          # The version comes from go.mod: it is never duplicated here.
          go-version-file: go.mod
          # Cache the modules and the Go build cache.
          cache: true

      - name: Build and vet
        run: |
          go build ./...
          go vet ./...

      - name: Structural guards
        run: |
          ./scripts/check-cross-feature-imports.sh
          ./scripts/check-file-size.sh
          ./scripts/check-sommaire.sh

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

      - name: Unit tests (make check)
        run: make check

      # Without this step, the repository's eight structural guards would run ONLY when a human
      # types `make lint`. The guard keeping the trust decision inside the query, the one forbidding
      # math/rand for the seal, and the one holding authtest out of the binary are worth nothing if
      # the pipeline does not run them.
      - name: Structural guards (make lint)
        run: make lint

      - name: Install golang-migrate
        run: |
          curl -fsSL "https://github.com/golang-migrate/migrate/releases/download/${MIGRATE_VERSION}/migrate.linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin migrate
          migrate -version

      - name: Apply the migrations
        run: make up-dev

      - name: Integration tests
        run: make test-integration
