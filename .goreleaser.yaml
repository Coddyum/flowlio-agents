# Binary releases. Triggered by a tag, never by hand.
#
# Two binaries, two audiences: `flowlio` is the one everybody downloads — the CLI and the MCP
# server. `api` is only useful to somebody self-hosting without Docker; it is published because not
# publishing it would force that person to install a Go toolchain.
#
# Nothing here signs with a key: a signature whose private key lives in a repository's secrets does
# not prove much. The provenance attestation is produced by the GitHub workflow
# (`actions/attest-build-provenance`), which ties it to the identity of the repository and the tag.
# Checksums are still published; they verify a download, they do not authenticate it.
version: 2

project_name: flowlio

before:
  hooks:
    - go mod download

builds:
  - id: flowlio
    main: ./cmd/flowlio
    binary: flowlio
    env:
      # No dependency on the target machine's libc: the binary has to run on an Alpine as well as on
      # an Ubuntu.
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags:
      # -trimpath strips the build machine's paths out of the binary: they teach the user nothing
      # and they make the compilation non-reproducible.
      - -trimpath
    ldflags:
      # THE TARGET SYMBOLS HAVE TO EXIST. The Go linker writes into a symbol it can find and says
      # NOTHING when it cannot — v0.1.0 through v0.3.0 shipped unstamped because neither binary
      # declared `version`. They now do (cmd/*/version.go), and a test asserts the agreement between
      # this line and those declarations.
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}}

  - id: api
    main: ./cmd/api
    binary: flowlio-api
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}}

archives:
  - id: default
    ids: [flowlio, api]
    # An archive name that reads without documentation: product, version, OS, architecture.
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats: [tar.gz]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  use: github
  sort: asc
  filters:
    # The release log addresses users: internal plumbing has no place in it.
    #
    # The `(\(...\))?` group is not decoration. Patterns anchored without it — `^docs:` — matched
    # ONLY the scopeless form, and this repository writes almost everything with a scope. Measured
    # on the v0.1.0 log: the 7 bare `docs:`/`test:`/`chore:`/`ci:` commits were indeed absent, and
    # the 6 `docs(m3):`, `test(trust):`… commits were ALL present. That contrast is what named the
    # cause — the filters worked, it was the shape that escaped them.
    #
    # SINGLE quotes: in YAML they leave backslashes as they are, so the pattern written is the one
    # Go compiles. Double quotes would need them doubled, and a `\(` turned into `(` would make the
    # literal parenthesis a group — the filter would silently miss again, which is the exact defect
    # being fixed.
    exclude:
      - '^docs(\(.+\))?:'
      - '^test(\(.+\))?:'
      - '^chore(\(.+\))?:'
      - '^ci(\(.+\))?:'

release:
  # A release stays a draft until a human has read it: a tag pushed by mistake must not publish
  # binaries to the whole world within the second.
  draft: true
  prerelease: auto
  footer: |
    ## Installation

    ```sh
    tar xzf flowlio_{{ .Version }}_<os>_<arch>.tar.gz
    sudo install flowlio /usr/local/bin/
    flowlio version
    ```

    Verify the download:

    ```sh
    sha256sum -c checksums.txt --ignore-missing
    ```

    Verify where the binaries came from — this repository, this tag, this workflow:

    ```sh
    gh attestation verify --repo Coddyum/flowlio-agents flowlio_{{ .Version }}_<os>_<arch>.tar.gz
    ```

    Setting up an instance: [README](https://github.com/Coddyum/flowlio-agents#setup).
    What changed: [CHANGELOG](https://github.com/Coddyum/flowlio-agents/blob/main/CHANGELOG.md).

    Licensed under AGPL-3.0. The code of this release is the tag `{{ .Tag }}`.

# The Homebrew formula, generated and pushed to the tap on every release — with the PREBUILT
# binaries, so an installer needs no Go toolchain (the hand-written v1.0.0 formula built from source;
# this replaces it from the next tag on). It needs a token with write access to the tap repository,
# which GITHUB_TOKEN is not: that one is scoped to THIS repository. HOMEBREW_TAP_TOKEN is a PAT with
# `contents:write` on Coddyum/homebrew-flowlio, passed by the release workflow.
#
# Both binaries ship in the archive, so the formula installs both — `flowlio` (CLI/MCP/waker) and
# `flowlio-api` (the engine self-host starts).
brews:
  - name: flowlio
    repository:
      owner: Coddyum
      name: homebrew-flowlio
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/Coddyum/flowlio-agents"
    description: "Project manager for AI agents: cross-repo issues, and a waker that closes the loop"
    license: "AGPL-3.0-only"
    commit_author:
      name: flowlio-release
      email: release@flowlio.me
    install: |
      bin.install "flowlio"
      bin.install "flowlio-api"
    caveats: |
      Self-host runs Postgres 18 in a container flowlio manages — install Docker first, then run:
        flowlio
    test: |
      assert_match "flowlio", shell_output("#{bin}/flowlio version")
