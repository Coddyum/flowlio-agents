version: "2"
sql:
  - engine: "postgresql"
    # sqlc reads the migrations directly: no duplicated schema, so no drift possible.
    # `make schema` produces sql/schema/schema.sql, a readable snapshot (pg_dump) of the database.
    schema: "sql/migrations"
    queries: "sql/queries"
    gen:
      go:
        package: "database"
        out: "internal/database"
        # database/sql (and not native pgx): the stores' Transactor pattern rests on *sql.DB.
        sql_package: "database/sql"
        emit_json_tags: true
        emit_empty_slices: true
        emit_prepared_queries: false
        emit_interface: false
        emit_pointers_for_null_types: true
