version: "2"
sql:
  - engine: "postgresql"
    # sqlc lit directement les migrations : pas de schéma dupliqué, donc pas de dérive possible.
    # `make schema` produit sql/schema/schema.sql, un instantané lisible (pg_dump) de la base.
    schema: "sql/migrations"
    queries: "sql/queries"
    gen:
      go:
        package: "database"
        out: "internal/database"
        # database/sql (et non pgx natif) : le pattern Transactor des stores repose sur *sql.DB.
        sql_package: "database/sql"
        emit_json_tags: true
        emit_empty_slices: true
        emit_prepared_queries: false
        emit_interface: false
        emit_pointers_for_null_types: true
